<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Redirect | ZERONIC Pakistan</title>
  <script>
    (function() {
      var path = window.location.pathname || '';
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var clean = path.replace(/\/+$/, '').toLowerCase();
      
      if (clean.endsWith('contact-us') || clean.endsWith('contact') || clean.endsWith('contact-us.html')) {
        window.location.replace('/contact-us/' + search + hash);
        return;
      }
      if (clean.endsWith('privacy-policy') || clean.endsWith('privacy') || clean.endsWith('privacy-policy.html')) {
        window.location.replace('/privacy-policy/' + search + hash);
        return;
      }
      if (clean.endsWith('shipping-policy') || clean.endsWith('shipping') || clean.endsWith('shipping-return-policy') || clean.endsWith('shipping-policy.html')) {
        window.location.replace('/shipping-policy/' + search + hash);
        return;
      }
      window.location.replace('/' + search + hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/" />
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8fafc; color: #0f172a;">
  <div style="text-align: center; max-width: 420px; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);">
    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Loading Page...</h2>
    <p style="font-size: 14px; color: #64748b; margin-bottom: 20px;">Redirecting you to the requested section.</p>
    <a href="/" style="display: inline-block; background: #0062d8; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px;">Return to Home</a>
  </div>
</body>
</html>
