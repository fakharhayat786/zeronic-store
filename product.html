<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZERONIC Flex Earbuds – Premium Wireless Sound</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #0062d8;
      --hover-blue: #004eb0;
      --dark-ink: #111111;
      --text-muted: #555555;
      --border-light: rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Manrope", sans-serif; color: var(--dark-ink); background: #ffffff; line-height: 1.5; }
    .page-width { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    
    /* Header (Matches your Home style) */
    .site-header { position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-light); padding: 15px 0; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 2px; }
    .site-header a { text-decoration: none; color: var(--dark-ink); }

    /* Product Grid Layout */
    .product-container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px 0; }
    @media (max-width: 768px) { .product-container { grid-template-columns: 1fr; gap: 20px; padding: 20px 0; } }

    /* Media Gallery Slider */
    .gallery-viewer { position: relative; width: 100%; border: 1px solid var(--border-light); border-radius: 24px; overflow: hidden; background: #ffffff; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; }
    .gallery-viewer img { max-width: 90%; max-height: 90%; object-fit: contain; }
    .th-badge { position: absolute; top: 12px; left: 12px; background: rgba(0, 98, 216, 0.09); color: var(--primary-blue); font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em; }
    .sale-badge { position: absolute; top: 12px; right: 12px; background: #dc2626; color: #ffffff; font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 999px; }

    .thumbnail-list { display: flex; gap: 10px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
    .thumbnail-list::-webkit-scrollbar { display: none; }
    .thumb-item { flex: 0 0 70px; height: 70px; border: 1px solid var(--border-light); border-radius: 12px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #ffffff; }
    .thumb-item img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* Product Specs Entry Details */
    .product-title { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
    .product-eyebrow { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    
    .rating-row { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }
    .stars { color: #ffb800; font-size: 16px; letter-spacing: 1px; }
    .rating-val { font-size: 14px; font-weight: 800; }
    .reviews-count { font-size: 14px; color: var(--primary-blue); text-decoration: none; font-weight: 600; }

    .pricebar { display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px; }
    .pricebar .price { font-weight: 800; font-size: 30px; color: var(--dark-ink); }
    .pricebar .compare { font-weight: 600; font-size: 18px; color: #9aa3ad; text-decoration: line-through; }
    .pricebar .off { padding: 4px 10px; border-radius: 999px; background: #dc2626; color: #fff; font-size: 12px; font-weight: 800; }

    /* Strips info block */
    .fstrip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #f8f9fa; border: 1px solid var(--border-light); border-radius: 16px; padding: 14px; margin-bottom: 28px; text-align: center; }
    .fstrip-title { font-weight: 800; font-size: 12px; text-transform: uppercase; color: var(--dark-ink); }
    .fstrip-sub { font-size: 10px; color: var(--text-muted); }

    /* Quantity & Buy Buttons */
    .qty-selector { display: flex; align-items: center; gap: 15px; margin-bottom: 24px; font-weight: 700; font-size: 13px; color: var(--text-muted); }
    .qty-btn { width: 24px; height: 24px; border: 1px solid #e5e7eb; background: #fff; border-radius: 50%; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .qty-input { width: 30px; text-align: center; border: 0; background: transparent; font-size: 14px; font-weight: 700; color: var(--dark-ink); }

    .btn-submit { display: block; width: 100%; background: var(--primary-blue); color: #ffffff; border: none; border-radius: 14px; padding: 14px; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: background 0.2s ease; margin-bottom: 12px; }
    .btn-submit:hover { background: var(--hover-blue); }

    /* Sticky Pill Navigation */
    .tab-nav-wrapper { background: #f3f3f3; padding: 6px; border-radius: 30px; display: flex; width: fit-content; margin: 30px auto; gap: 5px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); }
    .tab-link { padding: 8px 16px; border-radius: 20px; text-decoration: none; color: var(--text-muted); font-size: 12px; font-weight: 700; background: transparent; transition: all 0.2s; }
    .tab-link.active { background: #ffffff; color: var(--dark-ink); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

    /* Spec List Block Rows */
    .spec-box { background: #ffffff; border: 1px solid var(--border-light); border-radius: 20px; padding: 20px; margin-bottom: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
    .spec-row { display: grid; grid-template-columns: 240px 1fr; padding: 16px 0; border-bottom: 1px solid var(--border-light); }
    .spec-row:last-child { border-bottom: 0; }
    .spec-label { font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 0.02em; }
    .spec-value { font-size: 14px; color: var(--text-muted); }
    @media (max-width: 640px) { .spec-row { grid-template-columns: 1fr; gap: 4px; } }

    /* FAQ Section */
    .faq-box { background: #f8f9fa; border-radius: 16px; padding: 20px; margin-bottom: 40px; }
    .faq-title { font-size: 20px; font-weight: 800; margin-bottom: 15px; }
    .faq-item { border-bottom: 1px solid var(--border-light); padding: 12px 0; }
    .faq-item:last-child { border-bottom: 0; }
    .faq-q { font-weight: 700; font-size: 14px; margin-bottom: 6px; color: var(--dark-ink); }
    .faq-a { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }

    /* Sticky Bottom Bar Mobile Overlay */
    .mobile-sticky-bar { position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 9999; background: rgba(17, 17, 17, 0.8); backdrop-filter: blur(12px); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; color: #ffffff; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
    .msb-title { font-weight: 800; font-size: 13px; }
    .msb-price { font-weight: 700; font-size: 12px; opacity: 0.9; }
    .msb-btn { background: var(--primary-blue); color: #ffffff; border: none; border-radius: 12px; padding: 10px 16px; font-size: 12px; font-weight: 800; cursor: pointer; }
    @media (min-width: 769px) { .mobile-sticky-bar { display: none !important; } }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="page-width">
      <a href="index.html">ZERONIC</a>
    </div>
  </header>

  <main class="page-width" id="Overview">
